{% extends "school/base.html" %}{% block title %}Attendance{% endblock %}
{% block content %}<h1>Attendance</h1><form method="get"><label>Student / Enrollment</label><select name="enrollment" onchange="this.form.submit()">{% for e in enrollments %}<option value="{{e.id}}" {% if e.id == chosen.id %}selected{% endif %}>{{e.student.full_name}} — {{e.school_class.name}}</option>{% endfor %}</select><label>Date</label><input type="date" name="date" value="{{selected_date}}"><button type="submit">Load</button></form>
{% if chosen %}<form method="post" style="margin-top:20px">{% csrf_token %}<input type="hidden" name="date" value="{{selected_date}}"><p><b>{{chosen.student.full_name}}</b> — {{chosen.school_class.name}}</p><label>Status</label><select name="status"><option value="Present">Present</option><option value="Absent">Absent</option><option value="Late">Late</option><option value="Excused">Excused</option></select><label>Remarks</label><input name="remarks" value="{{record.remarks|default:''}}"><br><br><button type="submit">Save Attendance</button></form>{% endif %}{% endblock %}
